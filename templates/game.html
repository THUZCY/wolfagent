<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfAgent - 游戏进行中</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--text:#e0e0e0;--text-dim:#8888aa;--border:#2a2a4a;--good:#4ecca3;--bad:#e94560;--warn:#f0a500}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:340px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:14px;color:var(--text-dim)}
.player-list{flex:1;overflow-y:auto;padding:8px}
.player-card{background:#0d0d1f;border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid transparent;cursor:pointer;transition:all .2s}
.player-card:hover{border-color:var(--border)}
.player-card.selected{border-color:var(--accent);background:#111128}
.player-card.dead{opacity:.4}
.player-card .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.player-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.player-card .info{flex:1}
.player-card .name{font-size:14px;font-weight:600}
.player-card .role-hint{font-size:11px;color:var(--text-dim)}
.player-card .status{font-size:11px;padding:2px 8px;border-radius:6px}
.status-alive{background:var(--good)22;color:var(--good)}
.status-dead{background:var(--bad)22;color:var(--bad)}
.belief-bars{display:none;margin-top:8px}
.player-card.selected .belief-bars{display:block}
.belief-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}
.belief-row .label{width:24px;color:var(--text-dim)}
.belief-row .bar-wrap{flex:1;height:14px;background:#1a1a2e;border-radius:4px;overflow:hidden}
.belief-row .bar-fill{height:100%;border-radius:4px;transition:width .3s}
.belief-row .pct{width:32px;text-align:right;color:var(--text-dim)}
.reasoning-box{display:none;margin-top:8px}
.player-card.selected .reasoning-box{display:block}
.reasoning-box .r-title{font-size:10px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase}
.reasoning-box .r-item{font-size:11px;color:var(--text-dim);padding:2px 0 2px 8px;border-left:2px solid var(--accent)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-shrink:0}
.top-bar .phase-badge{font-size:12px;padding:4px 12px;border-radius:8px;background:var(--accent2);color:var(--accent);font-weight:600}
.top-bar .day-badge{font-size:12px;padding:4px 12px;border-radius:8px;background:#1a1a2e;color:var(--text-dim)}
.top-bar .alive-badge{font-size:12px;padding:4px 12px;border-radius:8px;background:#1a1a2e;color:var(--good)}
.top-bar .spacer{flex:1}
.chat-log{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
.chat-msg{display:flex;gap:10px;padding:6px 0;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0}
.chat-msg .body{flex:1}
.chat-msg .meta{font-size:11px;color:var(--text-dim);margin-bottom:2px}
.chat-msg .content{font-size:14px;line-height:1.5}
.msg-system{text-align:center;color:var(--text-dim);font-size:12px;padding:8px 0}
.msg-night{text-align:center;color:var(--warn);font-size:12px;padding:8px 0}
.msg-gameover{text-align:center;font-size:20px;font-weight:800;padding:20px 0}
.msg-gameover.win-villagers{color:var(--good)}
.msg-gameover.win-werewolves{color:var(--bad)}
.msg-speech{color:var(--text)}
.bottom-bar{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-shrink:0}
.btn{padding:10px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.day-sep{display:flex;align-items:center;gap:12px;padding:8px 0}
.day-sep hr{flex:1;border:none;border-top:1px solid var(--border)}
.day-sep span{font-size:11px;color:var(--text-dim);white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<div class="sidebar-header"><h2>👥 玩家列表</h2></div>
<div class="player-list" id="playerList"></div>
</div>
<div class="main">
<div class="top-bar">
<span class="phase-badge" id="phaseBadge">等待中</span>
<span class="day-badge" id="dayBadge">第 1 天</span>
<span class="alive-badge" id="aliveBadge">存活：7</span>
<span class="spacer"></span>
</div>
<div class="chat-log" id="chatLog"><div style="text-align:center;color:var(--text-dim);padding:40px">点击「下一步」开始游戏</div></div>
<div class="bottom-bar">
<button class="btn btn-primary" id="btnStep" onclick="stepGame()">▶ 下一步</button>
<button class="btn btn-secondary" id="btnAuto" onclick="toggleAuto()">⏩ 自动</button>
<button class="btn btn-secondary" onclick="window.location='/'">🏠 返回</button>
</div>
</div>
</div>

<script>
var gid = null;
var autoPlay = false;
var autoTimer = null;
var selectedPlayer = 0;

function getColor(n){var c=["#e94560","#f0a500","#4ecca3","#6c5ce7","#e056a0","#00b4d8","#ff6b6b"];return c[(n-1)%7]}

// Parse gid from URL
var params = new URLSearchParams(window.location.search);
gid = params.get("gid");
if (!gid) { window.location.href = "/"; }

var phaseNames = {
night_werewolf:"🌙 狼人行动",night_seer:"🌙 预言家查验",night_witch:"🌙 女巫行动",
day_announce:"☀️ 天亮公布",day_speech:"💬 发言阶段",day_vote:"🗳️ 投票阶段",
game_over:"🏁 游戏结束"
};

async function stepGame(){
document.getElementById("btnStep").disabled = true;
try {
var r = await fetch("/api/game/" + gid + "/step", {method:"POST"});
var d = await r.json();
handleState(d);
if (d.finished){
document.getElementById("btnStep").disabled = true;
document.getElementById("btnStep").textContent = "游戏结束";
document.getElementById("btnAuto").disabled = true;
document.getElementById("btnAuto").textContent = "游戏结束";
if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; autoPlay = false; }
} else {
await refreshPlayers();
}
} catch(e) { console.error(e); }
if (!d || !d.finished) document.getElementById("btnStep").disabled = false;
}

async function refreshPlayers(){
if (!gid) return;
try {
var r = await fetch("/api/game/" + gid + "/state");
var d = await r.json();
updatePlayerList(d.players || []);
updateTopBar(d);
if (d.log) updateChatLog(d.log);
if (selectedPlayer) refreshAgentView(selectedPlayer);
} catch(e){}
}

async function refreshAgentView(num){
if (!gid) return;
try {
var r = await fetch("/api/game/" + gid + "/state?player_num=" + num);
var d = await r.json();
if (d.agent_view){
var card = document.querySelector(".player-card[data-player='" + num + "']");
if (card){
var bb = card.querySelector(".belief-bars");
if (bb) bb.innerHTML = buildBeliefBars(d.agent_view.belief || {});
var rb = card.querySelector(".reasoning-box");
if (rb) rb.innerHTML = buildReasoning(d.agent_view.reasoning || []);
var rh = card.querySelector(".role-hint");
if (rh) rh.textContent = d.agent_view.role || "???";
}
}
} catch(e){}
}

function buildBeliefBars(belief){
var h = "";
var sorted = Object.entries(belief).sort(function(a,b){return b[1]-a[1]});
for (var i=0;i<sorted.length;i++){
var pid=sorted[i][0], prob=sorted[i][1], pct=Math.round(prob*100);
var color=pct>50?"var(--bad)":"var(--good)";
h+='<div class="belief-row"><span class="label">'+pid+'号</span>';
h+='<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>';
h+='<span class="pct">'+pct+'%</span></div>';
}
return h||'<div style="font-size:11px;color:var(--text-dim)">暂无信念数据</div>';
}

function buildReasoning(rs){
if(!rs||!rs.length) return '<div style="font-size:11px;color:var(--text-dim)">暂无推理数据</div>';
var h='<div class="r-title">推理依据</div>';
for(var i=0;i<Math.min(rs.length,8);i++){h+='<div class="r-item">'+rs[i]+'</div>'}
return h;
}

function updatePlayerList(plist){
var list=document.getElementById("playerList");
var h="";
for(var i=0;i<plist.length;i++){
var p=plist[i];
var cls="player-card";
if(p.number==selectedPlayer)cls+=" selected";
if(!p.alive)cls+=" dead";
h+='<div class="'+cls+'" data-player="'+p.number+'" onclick="selectPlayer('+p.number+')">';
h+='<div class="head">';
h+='<div class="player-num" style="background:'+getColor(p.number)+'22;color:'+getColor(p.number)+'">'+p.number+'</div>';
h+='<div class="info"><div class="name">'+p.number+'号</div>';
h+='<div class="role-hint">'+p.role+'</div></div>';
h+='<span class="status '+(p.alive?"status-alive":"status-dead")+'">'+(p.alive?"存活":"死亡")+'</span>';
h+='</div>';
h+='<div class="belief-bars"></div>';
h+='<div class="reasoning-box"></div>';
h+='</div>';
}
list.innerHTML=h;
if(selectedPlayer) refreshAgentView(selectedPlayer);
}

function selectPlayer(num){
document.querySelectorAll(".player-card").forEach(function(c){c.classList.remove("selected")});
var card=document.querySelector(".player-card[data-player='"+num+"']");
if(card){card.classList.add("selected");selectedPlayer=num;refreshAgentView(num);}
}

function updateTopBar(d){
document.getElementById("phaseBadge").textContent=phaseNames[d.phase]||d.phase;
document.getElementById("dayBadge").textContent="第 "+(d.day||1)+" 天";
var alives=d.alive||[];
document.getElementById("aliveBadge").textContent="存活："+alives.length;
}

var lastLogLen = 0;
function handleState(d){
updateTopBar(d);
if(d.log) updateChatLog(d.log);
if(d.game_over||d.finished){
var msg=d.winner==="villagers"?"🎉 村民阵营胜利！":"🐺 狼人阵营胜利！";
document.getElementById("chatLog").innerHTML+='<div class="msg-gameover '+(d.winner==="villagers"?"win-villagers":"win-werewolves")+'">'+msg+'</div>';
}
}

function updateChatLog(logData){
var cont=document.getElementById("chatLog");
var h="";
var lastDay=0;
for(var i=0;i<logData.length;i++){
var m=logData[i];
var d=m.day||0;
if(d&&d!==lastDay){lastDay=d;h+='<div class="day-sep"><hr><span>📅 第 '+d+' 天</span><hr></div>'}
var t=m.type;
if(t==="info"){h+='<div class="msg-system">'+m.msg+'</div>'}
else if(t==="night"){h+='<div class="msg-night">'+m.msg+'</div>'}
else if(t==="death"){h+='<div class="msg-system">💀 '+m.msg+'</div>'}
else if(t==="gameover"){
var cls=m.msg.indexOf("村民")>=0?"win-villagers":"win-werewolves";
h+='<div class="msg-gameover '+cls+'">'+m.msg+'</div>';
}
else if(t==="speech"){
h+='<div class="chat-msg"><div class="avatar" style="background:'+getColor(m.player)+'22;color:'+getColor(m.player)+'">'+m.player+'</div>';
h+='<div class="body"><div class="meta">'+m.player+'号 发言</div>';
h+='<div class="content">'+m.msg+'</div></div></div>';
}
else if(t==="vote"){
h+='<div class="msg-system">🗳️ '+m.msg+'</div>';
}
}
cont.innerHTML=h;
cont.scrollTop=cont.scrollHeight;
}

function toggleAuto(){
autoPlay=!autoPlay;
var btn=document.getElementById("btnAuto");
if(autoPlay){btn.textContent="⏸️ 停止";stepAuto();}
else{btn.textContent="⏩ 自动";if(autoTimer){clearTimeout(autoTimer);autoTimer=null;}}
}

function stepAuto(){
if(!autoPlay)return;
stepGame().then(function(){
autoTimer=setTimeout(stepAuto,300);
});
}

// Init
refreshPlayers();
</script>
</body>
</html>
