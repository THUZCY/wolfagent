<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfAgent - AI 狼人杀</title>
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--text:#e0e0e0;--text-dim:#8888aa;--border:#2a2a4a;--slider-track:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:720px;width:100%}
.hero{text-align:center;margin-bottom:36px}
.hero .icon{font-size:56px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h1{font-size:36px;font-weight:800;background:linear-gradient(135deg,var(--accent),#ff6b6b,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .subtitle{color:var(--text-dim);font-size:14px;margin-top:6px;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;transition:border-color 0.3s}
.card:hover{border-color:#3a3a5a}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.form-group label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
select,input[type=password],input[type=text]{background:#0d0d1f;border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s}
select:focus,input:focus{border-color:var(--accent)}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,<svg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M1 1L5 5L9 1' stroke='%238888aa' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.player-grid{display:grid;grid-template-columns:1fr;gap:12px}
.player-row{display:flex;align-items:center;gap:12px;background:#0d0d1f;border-radius:12px;padding:14px 16px;border:1px solid transparent;transition:all .2s}
.player-row:hover{border-color:var(--border);background:#111128}
.player-num{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.player-role{font-size:11px;color:var(--text-dim);text-align:center;width:48px;flex-shrink:0}
.sliders{display:flex;gap:16px;flex:1;flex-wrap:wrap}
.slider-group{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.slider-group .trait-label{font-size:12px;color:var(--text-dim);width:28px;flex-shrink:0}
.slider-group input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--slider-track);outline:none;cursor:pointer}
.slider-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer;transition:transform .15s}
.slider-group input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.slider-group .val{font-size:12px;color:var(--text-dim);width:24px;text-align:right;font-family:'SF Mono','Consolas',monospace}
.btn{display:block;width:100%;padding:16px;font-size:17px;font-weight:700;font-family:inherit;border:none;border-radius:14px;cursor:pointer;transition:all .25s;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#c0392b);color:#fff;box-shadow:0 4px 24px rgba(233,69,96,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 32px rgba(233,69,96,.45)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.preset-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.preset-btn{padding:6px 14px;font-size:12px;font-family:inherit;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;transition:all .2s}
.preset-btn:hover{border-color:var(--accent);color:var(--text)}
.preset-btn.active{background:var(--accent2);border-color:var(--accent);color:#fff}
.footer-note{text-align:center;color:var(--text-dim);font-size:12px;margin-top:20px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.error{background:#e74c3c}
.toast.success{background:#27ae60}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,15,26,.8);display:none;align-items:center;justify-content:center;z-index:9998}
.loading-overlay.show{display:flex}
.loading-spinner{text-align:center}
.loading-spinner .spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner p{color:var(--text-dim);font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="hero"><div class="icon">🐺</div><h1>WolfAgent</h1><p class="subtitle">基于多智能体协作与博弈的 AI 狼人杀</p></div>

<div class="card">
<div class="card-title"><span class="dot"></span>LLM 配置</div>
<div class="form-row">
<div class="form-group"><label>Provider</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="mock">Mock (测试)</option></select></div>
<div class="form-group" style="flex:2"><label>API Key</label><input type="password" id="apikey" value="sk-930d343d4e854882af94f6761ffcd2d3" placeholder="sk-..." /></div>
</div>
</div>

<div class="card">
<div class="card-title"><span class="dot"></span>角色分配</div>
<div class="player-grid" id="roleGrid"></div>
</div>

<div class="card">
<div class="card-title"><span class="dot"></span>AI 玩家人格配置</div>
<div class="preset-bar">
<button class="preset-btn active" data-preset="diverse">🎭 多样化</button>
<button class="preset-btn" data-preset="aggressive">🔥 全员激进</button>
<button class="preset-btn" data-preset="cautious">🛡️ 全员谨慎</button>
<button class="preset-btn" data-preset="random">🎲 随机</button>
</div>
<div class="player-grid" id="personalityGrid"></div>
</div>

<button class="btn btn-primary" id="btnStart" onclick="startGame()">🚀 开始游戏</button>
<p class="footer-note">WolfAgent v0.1 · 7 人局：2 狼人 + 1 预言家 + 1 女巫 + 3 村民</p>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="loading-spinner"><div class="spinner"></div><p>正在创建游戏...</p></div></div>

<script>
var PLAYERS=[{num:1,color:"#e94560"},{num:2,color:"#f0a500"},{num:3,color:"#4ecca3"},{num:4,color:"#6c5ce7"},{num:5,color:"#e056a0"},{num:6,color:"#00b4d8"},{num:7,color:"#ff6b6b"}];
var ROLES=["🐺 狼人","🐺 狼人","🔮 预言家","🧪 女巫","👤 村民","👤 村民","👤 村民"];
var PRESETS={
diverse:[{aggression:.8,talkativeness:.9,caution:.2},{aggression:.3,talkativeness:.4,caution:.9},{aggression:.6,talkativeness:.5,caution:.5},{aggression:.9,talkativeness:.7,caution:.1},{aggression:.2,talkativeness:.8,caution:.7},{aggression:.5,talkativeness:.3,caution:.6},{aggression:.7,talkativeness:.6,caution:.4}],
aggressive:[{aggression:.9,talkativeness:.8,caution:.1},{aggression:.8,talkativeness:.9,caution:.2},{aggression:.9,talkativeness:.7,caution:.1},{aggression:.8,talkativeness:.8,caution:.2},{aggression:.9,talkativeness:.9,caution:.1},{aggression:.8,talkativeness:.7,caution:.2},{aggression:.9,talkativeness:.8,caution:.1}],
cautious:[{aggression:.2,talkativeness:.4,caution:.9},{aggression:.3,talkativeness:.3,caution:.8},{aggression:.1,talkativeness:.5,caution:.9},{aggression:.2,talkativeness:.4,caution:.8},{aggression:.3,talkativeness:.3,caution:.9},{aggression:.1,talkativeness:.5,caution:.8},{aggression:.2,talkativeness:.4,caution:.9}]};
var currentPreset="diverse";

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function randomPreset(){return Array.from({length:7},function(){return{aggression:Math.round((Math.random()*.8+.1)*10)/10,talkativeness:Math.round((Math.random()*.8+.1)*10)/10,caution:Math.round((Math.random()*.8+.1)*10)/10}})}
function showToast(m,t){var e=document.getElementById("toast");e.textContent=m;e.className="toast "+t+" show";setTimeout(function(){e.className="toast"},2500)}
function loading(s){document.getElementById("loading").className=s?"loading-overlay show":"loading-overlay"}

function renderRoleGrid(){
var g=document.getElementById("roleGrid");
var roles=shuffle(ROLES);
var h="";
for(var i=0;i<PLAYERS.length;i++){
var p=PLAYERS[i];
h+='<div class="player-row"><div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div><div class="player-role">'+roles[i]+'</div><div style="flex:1;text-align:right;font-size:12px;color:var(--text-dim)">点击"开始游戏"后随机分配</div></div>';
}
g.innerHTML=h;
}

function renderPersonalityGrid(){
var g=document.getElementById("personalityGrid");
var preset=PRESETS[currentPreset]||randomPreset();
var h="";
for(var i=0;i<PLAYERS.length;i++){
var p=PLAYERS[i],t=preset[i];
h+='<div class="player-row"><div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div><div class="sliders">';
h+=slider(p.num,"aggression","激进",t.aggression);
h+=slider(p.num,"talkativeness","话多",t.talkativeness);
h+=slider(p.num,"caution","谨慎",t.caution);
h+="</div></div>";
}
g.innerHTML=h;
}

function slider(num,trait,label,val){
return '<div class="slider-group"><span class="trait-label">'+label+'</span><input type="range" min="0" max="1" step="0.1" value="'+val+'" data-player="'+num+'" data-trait="'+trait+'" oninput="updateSlider(this)"><span class="val" id="val-'+num+'-'+trait+'">'+val.toFixed(1)+'</span></div>';
}

function updateSlider(e){
var p=e.getAttribute("data-player"),t=e.getAttribute("data-trait");
var s=document.getElementById("val-"+p+"-"+t);
if(s)s.textContent=parseFloat(e.value).toFixed(1);
}

document.querySelectorAll(".preset-btn").forEach(function(b){
b.addEventListener("click",function(){
var n=this.getAttribute("data-preset");
currentPreset=n;
document.querySelectorAll(".preset-btn").forEach(function(x){x.classList.remove("active")});
this.classList.add("active");
if(n==="random")PRESETS.random=randomPreset();
renderPersonalityGrid();
});
});

async function startGame(){
var provider=document.getElementById("provider").value;
var apikey=document.getElementById("apikey").value.trim();
if(provider!=="mock"&&!apikey){showToast("请填写 API Key","error");return;}

var personalities=[];
document.querySelectorAll("#personalityGrid input[type=range]").forEach(function(e){
var p=parseInt(e.getAttribute("data-player")),t=e.getAttribute("data-trait");
if(!personalities[p-1])personalities[p-1]={};
personalities[p-1][t]=parseFloat(e.value);
});

var btn=document.getElementById("btnStart");
btn.disabled=true;btn.textContent="创建中...";loading(true);

try{
var form=new FormData();
form.append("provider",provider);
form.append("apikey",apikey||"mock");
form.append("personalities",JSON.stringify(personalities));
var r=await fetch("/api/game/create",{method:"POST",body:form});
var d=await r.json();
if(d.game_id){
window.location.href="/game?gid="+d.game_id;
}else{
showToast("创建游戏失败","error");
btn.disabled=false;btn.textContent="🚀 开始游戏";loading(false);
}
}catch(e){
showToast("网络错误: "+e.message,"error");
btn.disabled=false;btn.textContent="🚀 开始游戏";loading(false);
}
}

renderRoleGrid();
renderPersonalityGrid();
</script>
</body>
</html>
