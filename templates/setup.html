<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfAgent · 月下狼人杀</title>
<style>
/* ============================================
   Design System: 月下狼人杀
   Factions: Wolf(red) / God(gold) / Villager(green)
   ============================================ */
:root {
  --bg-deep: #070714;
  --bg-card: rgba(18,18,44,.65);
  --bg-card-hover: rgba(24,24,56,.75);
  --bg-input: rgba(8,8,28,.7);
  --wolf: #e63946;
  --wolf-dim: rgba(230,57,70,.15);
  --wolf-glow: rgba(230,57,70,.35);
  --god: #d4a843;
  --god-dim: rgba(212,168,67,.12);
  --god-glow: rgba(212,168,67,.28);
  --villager: #6a994e;
  --villager-dim: rgba(106,153,78,.12);
  --villager-glow: rgba(106,153,78,.22);
  --accent: #e94560;
  --text: #e8e6e3;
  --text-dim: #8888a8;
  --text-muted: #5a5a78;
  --border: rgba(255,255,255,.06);
  --border-strong: rgba(255,255,255,.1);
  --radius: 20px;
  --radius-sm: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  padding: 24px;
  overflow-x: hidden;
  position: relative;
}
/* ===== 星空粒子背景 ===== */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.stars::before, .stars::after {
  content: ''; position: absolute; inset: 0;
}
.stars::before {
  background-image:
    radial-gradient(1px 1px at 10% 8%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.5px 1.5px at 25% 18%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 40% 5%, rgba(255,255,255,.8), transparent),
    radial-gradient(2px 2px at 55% 28%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 68% 12%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 82% 22%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 93% 8%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 35% 42%, rgba(255,255,255,.4), transparent),
    radial-gradient(2px 2px at 52% 65%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 72% 48%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 88% 58%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 8% 78%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 28% 85%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 48% 75%, rgba(255,255,255,.6), transparent),
    radial-gradient(2px 2px at 65% 82%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 80% 72%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 95% 90%, rgba(255,255,255,.5), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}
.stars::after {
  background-image:
    radial-gradient(1.5px 1.5px at 18% 30%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 45% 15%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 75% 55%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 5% 65%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 32% 70%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 55% 85%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 85% 35%, rgba(255,255,255,.5), transparent);
  animation: twinkle 3.5s ease-in-out infinite alternate-reverse;
}
@keyframes twinkle { 0% { opacity: .8; } 100% { opacity: 1; } }
/* ===== 月轮 ===== */
.moon {
  position: fixed; top: 36px; right: 48px;
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #faf5e0 0%, #e8d8a0 25%, #c8a860 55%, #8a6830 100%);
  box-shadow:
    0 0 40px rgba(210,180,120,.2),
    0 0 80px rgba(200,160,100,.12),
    0 0 140px rgba(180,140,80,.06);
  animation: moonGlow 5s ease-in-out infinite;
  z-index: 0;
}
.moon::after {
  content: '';
  position: absolute; inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.08), transparent 60%);
}
@keyframes moonGlow {
  0%, 100% { box-shadow: 0 0 40px rgba(210,180,120,.2), 0 0 80px rgba(200,160,100,.12), 0 0 140px rgba(180,140,80,.06); }
  50% { box-shadow: 0 0 55px rgba(210,180,120,.28), 0 0 100px rgba(200,160,100,.18), 0 0 160px rgba(180,140,80,.1); }
}
/* ===== 容器 ===== */
.container { max-width: 740px; width: 100%; position: relative; z-index: 1; }
/* ===== Hero ===== */
.hero {
  text-align: center; margin-bottom: 44px;
  position: relative;
}
.hero .emblem {
  display: inline-block; font-size: 72px;
  animation: floatIcon 4s ease-in-out infinite;
  filter: drop-shadow(0 0 28px rgba(230,57,70,.35));
  margin-bottom: 8px;
}
@keyframes floatIcon {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
}
.hero h1 {
  font-size: 44px; font-weight: 900; letter-spacing: 8px;
  background: linear-gradient(135deg, #e63946 0%, #d4853b 28%, #d4a843 50%, #c8a860 68%, #6a994e 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.hero .subtitle {
  color: var(--text-dim); font-size: 13px;
  letter-spacing: 4px; font-weight: 300;
}
.hero .faction-row {
  display: flex; justify-content: center; gap: 16px; margin-top: 20px;
}
.hero .faction-tag {
  font-size: 11px; letter-spacing: 2px; padding: 5px 18px;
  border-radius: 20px; font-weight: 500;
  backdrop-filter: blur(8px);
}
.faction-wolf { background: var(--wolf-dim); color: #f07080; border: 1px solid rgba(230,57,70,.25); }
.faction-god { background: var(--god-dim); color: #e0c060; border: 1px solid rgba(212,168,67,.25); }
.faction-villager { background: var(--villager-dim); color: #80b868; border: 1px solid rgba(106,153,78,.25); }
/* ===== 玻璃卡片 ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 30px;
  margin-bottom: 18px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: border-color .35s, box-shadow .35s, transform .35s;
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
}
.card:hover {
  border-color: var(--border-strong);
  box-shadow: 0 8px 40px rgba(0,0,0,.25);
  transform: translateY(-1px);
}
.card-title {
  font-size: 15px; font-weight: 700; margin-bottom: 22px;
  display: flex; align-items: center; gap: 10px; color: var(--text);
  letter-spacing: 1.5px;
}
.card-title .dot {
  width: 10px; height: 10px; border-radius: 3px;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent)55;
}
/* ===== 表单 ===== */
.form-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 160px; }
.form-group label {
  font-size: 10px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;
}
select, input[type=password], input[type=text] {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  color: var(--text); font-size: 14px; font-family: inherit;
  outline: none;
  transition: border-color .25s, box-shadow .25s;
  backdrop-filter: blur(4px);
}
select:focus, input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(233,69,96,.08);
}
select {
  cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238888a8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 14px center;
  padding-right: 36px;
}
/* ===== 角色网格 ===== */
.player-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.player-row {
  display: flex; align-items: center; gap: 14px;
  background: rgba(10,10,30,.5); border-radius: var(--radius-sm);
  padding: 13px 18px; border: 1px solid transparent;
  transition: all .25s; position: relative;
  backdrop-filter: blur(8px);
}
.player-row:hover {
  border-color: var(--border-strong);
  background: rgba(16,16,40,.6);
  transform: translateX(4px);
}
.player-num {
  width: 42px; height: 42px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px; flex-shrink: 0;
  box-shadow: 0 2px 14px rgba(0,0,0,.3);
  transition: transform .2s;
}
.player-row:hover .player-num { transform: scale(1.05); }
.player-role {
  font-size: 13px; font-weight: 600; text-align: center;
  width: 90px; flex-shrink: 0; padding: 5px 0; border-radius: 6px;
}
.role-wolf { color: #f07080; background: var(--wolf-dim); }
.role-god { color: #e0c060; background: var(--god-dim); }
.role-villager { color: #80b868; background: var(--villager-dim); }
.role-hint {
  flex: 1; text-align: right; font-size: 11px;
  color: var(--text-muted); font-style: italic;
}
/* ===== 滑块 ===== */
.sliders { display: flex; gap: 20px; flex: 1; flex-wrap: wrap; }
.slider-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 140px; }
.slider-group .trait-label {
  font-size: 12px; color: var(--text-dim);
  width: 30px; flex-shrink: 0; font-weight: 600;
}
.slider-group input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 5px; border-radius: 3px;
  background: rgba(255,255,255,.08); outline: none; cursor: pointer;
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 6px;
  background: var(--accent); border: 2px solid var(--bg-deep);
  cursor: pointer; transition: transform .15s, box-shadow .15s;
  box-shadow: 0 0 14px var(--wolf-glow);
}
.slider-group input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.15); box-shadow: 0 0 20px var(--wolf-glow);
}
.slider-group .val {
  font-size: 12px; color: var(--text-dim); width: 28px; text-align: right;
  font-family: 'SF Mono','Consolas',monospace; font-weight: 600;
}
/* ===== 按钮 ===== */
.btn {
  display: block; width: 100%; padding: 18px;
  font-size: 16px; font-weight: 700; font-family: inherit;
  border: none; border-radius: 16px; cursor: pointer;
  transition: all .3s cubic-bezier(.4,0,.2,1);
  letter-spacing: 3px; position: relative; overflow: hidden;
}
.btn-benchmark {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 32px;
  background: linear-gradient(135deg, rgba(212,168,67,.15), rgba(200,160,100,.1));
  border: 1px solid rgba(212,168,67,.25);
  border-radius: 30px; color: var(--god);
  font-size: 15px; font-weight: 600; cursor: pointer;
  text-decoration: none; transition: all .3s; position: relative;
  overflow: hidden; letter-spacing: 1px;
}
.btn-benchmark:hover { background: linear-gradient(135deg, rgba(212,168,67,.25), rgba(200,160,100,.18)); border-color: rgba(212,168,67,.4); }
.benchmark-panel {
  margin-top: 30px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: left;
}
.bench-header { margin-bottom: 16px; }
.bench-header h3 { color: var(--text); font-size: 16px; margin-bottom: 4px; }
.bench-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 13px; }
.bench-controls button {
  padding: 6px 18px;
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all .2s;
}
.bench-controls button:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
.bench-progress { margin: 12px 0; }
.bench-bar-wrap { height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.bench-bar-fill { height: 100%; background: linear-gradient(90deg, var(--god), var(--accent)); border-radius: 4px; transition: width .3s; width: 0%; }
.bench-text { font-size: 11px; color: var(--text-dim); }
.bench-results { margin-top: 16px; }
.bench-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
.bench-table th { color: var(--text-dim); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.bench-table td { color: var(--text); padding: 5px 8px; border-bottom: 1px solid var(--border); }
.btn-primary {
  background: linear-gradient(135deg, #8b1a1a, #c0392b 40%, #e63946);
  color: #fff;
  box-shadow: 0 8px 32px rgba(230,57,70,.25);
}
.btn-primary::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.06), transparent 60%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(230,57,70,.4);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled {
  opacity: .45; cursor: not-allowed; transform: none;
}
/* ===== 预设按钮 ===== */
.preset-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.preset-btn {
  padding: 8px 18px; font-size: 12px; font-family: inherit;
  background: rgba(18,18,44,.5); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-dim); cursor: pointer;
  transition: all .25s; letter-spacing: .5px; font-weight: 600;
  backdrop-filter: blur(8px);
}
.preset-btn:hover {
  border-color: var(--border-strong); color: var(--text);
  background: rgba(24,24,56,.6);
}
.preset-btn.active {
  background: var(--wolf-dim); border-color: rgba(230,57,70,.35);
  color: #f07080;
}
/* ===== Footer ===== */
.footer-note {
  text-align: center; color: var(--text-muted);
  font-size: 12px; margin-top: 28px; letter-spacing: 1px;
}
.footer-note .comp {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 12px; border-radius: 14px;
  margin: 0 4px;
  font-size: 11px;
}
.comp-wolf { background: var(--wolf-dim); color: #f07080; }
.comp-god { background: var(--god-dim); color: #e0c060; }
.comp-villager { background: var(--villager-dim); color: #80b868; }
/* ===== Toast ===== */
.toast {
  position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
  background: #8b1a1a; color: #fff;
  padding: 14px 32px; border-radius: 12px;
  font-size: 14px; font-weight: 600; z-index: 9999;
  opacity: 0; transition: opacity .3s, transform .3s;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  backdrop-filter: blur(12px); letter-spacing: .5px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
.toast.error { background: #6b0f0f; }
/* ===== Loading ===== */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(7,7,20,.88);
  display: flex; align-items: center; justify-content: center;
  z-index: 9998; opacity: 0; pointer-events: none;
  transition: opacity .35s;
  backdrop-filter: blur(4px);
}
.loading-overlay.show { opacity: 1; pointer-events: auto; }
.loading-spinner { text-align: center; }
.loading-spinner .spinner {
  width: 56px; height: 56px;
  border: 3px solid rgba(255,255,255,.06);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 22px;
  box-shadow: 0 0 24px rgba(233,69,96,.2);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-spinner p {
  color: var(--text-dim); font-size: 14px; letter-spacing: 2px;
}
/* ===== 响应式 ===== */
@media (max-width: 640px) {
  .hero h1 { font-size: 30px; letter-spacing: 4px; }
  .hero .emblem { font-size: 52px; }
  .card { padding: 20px 16px; border-radius: 16px; }
  .form-row { flex-direction: column; }
  .player-role { width: 70px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="moon"></div>
<div class="container">
  <div class="hero">
    <div class="emblem">🐺</div>
    <h1>月 下 狼 人 杀</h1>
    <p class="subtitle">多智能体协作 · 博弈推理</p>
    <div class="faction-row">
      <span class="faction-tag faction-wolf">🐺 狼人阵营</span>
      <span class="faction-tag faction-god">🔮 神职阵营</span>
      <span class="faction-tag faction-villager">👤 平民阵营</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>LLM 配置</div>
    <div class="form-row">
      <div class="form-group">
        <label>Provider</label>
        <select id="provider">
          <option value="mock" selected>Mock (No API Key)</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="groq">Groq (Free)</option>
          <option value="gemini">Gemini (Free)</option>
          <option value="ollama">Ollama (Local/Free)</option>
        </select>
      </div>
      <div class="form-group" style="flex:2">
        <label>API Key</label>
        <input type="password" id="apikey" value="" placeholder="sk-..." />
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>角色分配 · 7人局</div>
    <div class="player-grid" id="roleGrid"></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="dot"></span>AI 人格配置</div>
    <div class="preset-bar">
      <button class="preset-btn active" data-preset="diverse">🎭 多样化</button>
      <button class="preset-btn" data-preset="aggressive">🔥 全员激进</button>
      <button class="preset-btn" data-preset="cautious">🛡️ 全员谨慎</button>
      <button class="preset-btn" data-preset="random">🎲 随机</button>
    </div>
    <div class="player-grid" id="personalityGrid"></div>
  </div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
  <button class="btn btn-primary" id="btnStart" onclick="startGame()">🌙 开 始 游 戏</button>
  <button class="btn btn-benchmark" id="btnBench" onclick="toggleBenchmark()">📊 多局实验</button>
</div>
  <p class="footer-note">
    <span class="comp comp-wolf">🐺 2 狼人</span>
    <span class="comp comp-god">🔮 1 预言家</span>
    <span class="comp comp-god">🧪 1 女巫</span>
    <span class="comp comp-villager">👤 3 村民</span>
  </p>
</div>

<div class="benchmark-panel" id="benchmarkPanel" style="display:none">
  <div class="bench-header">
    <h3>📊 多局实验 (Benchmark)</h3>
    <p style="font-size:12px;color:var(--text-dim)">自动运行 N 局游戏并汇总统计数据</p>
  </div>
  <div class="bench-controls">
    <label>局数: <input type="number" id="benchGames" value="5" min="1" max="100" style="width:70px;background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;"></label>
    <button id="btnBenchStart" onclick="startBenchmark()">▶ 开始实验</button>
    <button id="btnBenchStop" onclick="stopBenchmark()" style="display:none">⏩ 停止</button>
  </div>
  <div class="bench-progress" id="benchProgress" style="display:none">
    <div class="bench-bar-wrap"><div class="bench-bar-fill" id="benchBarFill"></div></div>
    <span class="bench-text" id="benchText"></span>
  </div>
  <div class="bench-results" id="benchResults" style="display:none">
    <div id="benchStats"></div>
    <div id="benchTable"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"><div class="spinner"></div><p>正在创建游戏...</p></div>
</div>

<script>
var PLAYERS=[{num:1,color:"#e63946"},{num:2,color:"#f0a500"},{num:3,color:"#4ecca3"},{num:4,color:"#6c5ce7"},{num:5,color:"#e056a0"},{num:6,color:"#00b4d8"},{num:7,color:"#ff6b6b"}];
var ROLES=["🐺 狼人","🐺 狼人","🔮 预言家","🧪 女巫","👤 村民","👤 村民","👤 村民"];
var ROLE_CLASS={"🐺 狼人":"role-wolf","🔮 预言家":"role-god","🧪 女巫":"role-god","👤 村民":"role-villager"};
var PRESETS={
diverse:[{aggression:.8,talkativeness:.9,caution:.2},{aggression:.3,talkativeness:.4,caution:.9},{aggression:.6,talkativeness:.5,caution:.5},{aggression:.9,talkativeness:.7,caution:.1},{aggression:.2,talkativeness:.8,caution:.7},{aggression:.5,talkativeness:.3,caution:.6},{aggression:.7,talkativeness:.6,caution:.4}],
aggressive:[{aggression:.9,talkativeness:.8,caution:.1},{aggression:.8,talkativeness:.9,caution:.2},{aggression:.9,talkativeness:.7,caution:.1},{aggression:.8,talkativeness:.8,caution:.2},{aggression:.9,talkativeness:.9,caution:.1},{aggression:.8,talkativeness:.7,caution:.2},{aggression:.9,talkativeness:.8,caution:.1}],
cautious:[{aggression:.2,talkativeness:.4,caution:.9},{aggression:.3,talkativeness:.3,caution:.8},{aggression:.1,talkativeness:.5,caution:.9},{aggression:.2,talkativeness:.4,caution:.8},{aggression:.3,talkativeness:.3,caution:.9},{aggression:.1,talkativeness:.5,caution:.8},{aggression:.2,talkativeness:.4,caution:.9}]};
var currentPreset="diverse";

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function randomPreset(){return Array.from({length:7},function(){return{aggression:Math.round((Math.random()*.8+.1)*10)/10,talkativeness:Math.round((Math.random()*.8+.1)*10)/10,caution:Math.round((Math.random()*.8+.1)*10)/10}})}
function showToast(m,t){var e=document.getElementById("toast");e.textContent=m;e.className="toast "+t+" show";setTimeout(function(){e.className="toast"},2500)}
function loading(s){document.getElementById("loading").className=s?"loading-overlay show":"loading-overlay"}

function renderRoleGrid(){
  var g=document.getElementById("roleGrid"),roles=shuffle(ROLES),h="";
  for(var i=0;i<PLAYERS.length;i++){
    var p=PLAYERS[i],r=roles[i],cls=ROLE_CLASS[r]||"";
    h+='<div class="player-row">';
    h+='<div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div>';
    h+='<div class="player-role '+cls+'">'+r+'</div>';
    h+='<div class="role-hint">点击「开始游戏」后随机分配</div>';
    h+='</div>';
  }
  g.innerHTML=h;
}

function renderPersonalityGrid(){
  var g=document.getElementById("personalityGrid"),preset=PRESETS[currentPreset]||randomPreset(),h="";
  for(var i=0;i<PLAYERS.length;i++){
    var p=PLAYERS[i],t=preset[i];
    h+='<div class="player-row"><div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div><div class="sliders">';
    h+=slider(p.num,"aggression","激进",t.aggression);
    h+=slider(p.num,"talkativeness","话多",t.talkativeness);
    h+=slider(p.num,"caution","谨慎",t.caution);
    h+="</div></div>";
  }
  g.innerHTML=h;
}

function slider(num,trait,label,val){
  return '<div class="slider-group"><span class="trait-label">'+label+'</span><input type="range" min="0" max="1" step="0.1" value="'+val+'" data-player="'+num+'" data-trait="'+trait+'" oninput="updateSlider(this)"><span class="val" id="val-'+num+'-'+trait+'">'+val.toFixed(1)+'</span></div>';
}

function updateSlider(e){
  var p=e.getAttribute("data-player"),t=e.getAttribute("data-trait");
  var s=document.getElementById("val-"+p+"-"+t);
  if(s)s.textContent=parseFloat(e.value).toFixed(1);
}

document.querySelectorAll(".preset-btn").forEach(function(b){
  b.addEventListener("click",function(){
    var n=this.getAttribute("data-preset");currentPreset=n;
    document.querySelectorAll(".preset-btn").forEach(function(x){x.classList.remove("active")});
    this.classList.add("active");
    if(n==="random")PRESETS.random=randomPreset();
    renderPersonalityGrid();
  });
});

async function startGame(){
  var provider=document.getElementById("provider").value,apikey=document.getElementById("apikey").value.trim();
  if(provider!=="mock"&&provider!=="ollama"&&!apikey){showToast("请填写 API Key","error");return;}
  var personalities=[];
  document.querySelectorAll("#personalityGrid input[type=range]").forEach(function(e){
    var p=parseInt(e.getAttribute("data-player")),t=e.getAttribute("data-trait");
    if(!personalities[p-1])personalities[p-1]={};
    personalities[p-1][t]=parseFloat(e.value);
  });
  var btn=document.getElementById("btnStart");btn.disabled=true;btn.textContent="创建中...";loading(true);
  try{
    var form=new FormData();form.append("provider",provider);form.append("apikey",apikey||"mock");form.append("personalities",JSON.stringify(personalities));
    var r=await fetch("/api/game/create",{method:"POST",body:form}),d=await r.json();
    if(d.game_id){window.location.href="/game?gid="+d.game_id}
    else{showToast("创建游戏失败","error");btn.disabled=false;btn.textContent="🌙 开 始 游 戏";loading(false)}
  }catch(e){showToast("网络错误: "+e.message,"error");btn.disabled=false;btn.textContent="🌙 开 始 游 戏";loading(false)}
}


var benchBid = null;
var benchPollTimer = null;
function toggleBenchmark() {
  var p = document.getElementById("benchmarkPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
}
function stopBenchmark() {
  if (benchPollTimer) { clearInterval(benchPollTimer); benchPollTimer = null; }
  document.getElementById("btnBenchStart").style.display = "";
  document.getElementById("btnBenchStop").style.display = "none";
  document.getElementById("benchProgress").style.display = "none";
  document.getElementById("benchText").textContent = "已停止";
}
async function startBenchmark() {
  var n = parseInt(document.getElementById("benchGames").value) || 5;
  var btnS = document.getElementById("btnBenchStart");
  var btnSt = document.getElementById("btnBenchStop");
  var prog = document.getElementById("benchProgress");
  var res = document.getElementById("benchResults");
  btnS.style.display = "none";
  btnSt.style.display = "";
  prog.style.display = "block";
  res.style.display = "none";
  document.getElementById("benchText").textContent = "启动中...";

  try {
    var r = await fetch("/api/benchmark/start", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: "games_count=" + n + "&provider=mock&apikey="
    });
    var d = await r.json();
    benchBid = d.benchmark_id;
    document.getElementById("benchText").textContent = "已启动 " + n + " 局实验...";
    benchPollTimer = setInterval(pollBenchProgress, 3000);
  } catch(e) {
    document.getElementById("benchText").textContent = "错误: " + e.message;
    stopBenchmark();
  }
}
async function pollBenchProgress() {
  if (!benchBid) return;
  try {
    var r = await fetch("/api/benchmark/" + benchBid + "/results");
    var d = await r.json();
    if (d.error) {
      // still running, check progress
      var pr = await fetch("/api/benchmark/" + benchBid + "/progress");
      var p = await pr.json();
      document.getElementById("benchText").textContent = "已完成 " + (p.current||0) + "/" + (p.total||0);
      var fill = document.getElementById("benchBarFill");
      if (p.total > 0) fill.style.width = ((p.current||0)/p.total*100) + "%";
    } else {
      // done!
      clearInterval(benchPollTimer);
      benchPollTimer = null;
      document.getElementById("btnBenchStart").style.display = "";
      document.getElementById("btnBenchStop").style.display = "none";
      document.getElementById("benchProgress").style.display = "none";
      document.getElementById("benchResults").style.display = "block";
      showBenchResults(d);
    }
  } catch(e) {}
}
function showBenchResults(d) {
  var total = d.total_games || 0;
  var h = "<p><strong>完成 " + total + " 局实验</strong></p>";
  h += "<table class="bench-table">";
  h += "<tr><th>指标</th><th>数值</th></tr>";
  h += "<tr><td>狼人胜率</td><td>" + Math.round((d.werewolf_win_rate||0)*100) + "%</td></tr>";
  h += "<tr><td>好人胜率</td><td>" + Math.round((d.villager_win_rate||0)*100) + "%</td></tr>";
  h += "<tr><td>平均游戏天数</td><td>" + (d.average_game_length_days||0) + "</td></tr>";
  h += "<tr><td>狼人识别准确率</td><td>" + Math.round((d.wolf_identification_accuracy||0)*100) + "%</td></tr>";
  h += "<tr><td>投票准确率</td><td>" + Math.round((d.vote_accuracy||0)*100) + "%</td></tr>";
  h += "<tr><td>平均得分</td><td>" + (d.average_score||0) + "/100</td></tr>";
  var sr = d.survival_rates_by_role || {};
  for (var role in sr) { h += "<tr><td>" + role + "存活率</td><td>" + Math.round(sr[role]*100) + "%</td></tr>"; }
  h += "</table>";
  document.getElementById("benchStats").innerHTML = h;
}


renderRoleGrid();
renderPersonalityGrid();
</script>
</body>
</html>
