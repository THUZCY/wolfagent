<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WolfAgent · 月下狼人杀</title>
<style>
:root {
  --bg: #0a0a14;
  --card: #12122a;
  --card-hover: #181838;
  --wolf: #c0392b;
  --wolf-glow: rgba(192,57,43,.35);
  --god: #d4a843;
  --god-glow: rgba(212,168,67,.3);
  --villager: #5b8c5a;
  --villager-glow: rgba(91,140,90,.25);
  --accent: #e94560;
  --text: #e8e6e3;
  --text-dim: #7a7a9a;
  --text-muted: #555570;
  --border: #252545;
  --border-glow: #3a3a60;
  --slider-track: #1e1e3a;
  --moon: #c8c0a0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: 'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; justify-content: center; align-items: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}
/* ── 星空背景 ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 40%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 60% 75%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 90% 65%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 35% 80%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 75% 85%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 50% 55%, rgba(255,255,255,.4), transparent);
  pointer-events: none; z-index: 0;
}
/* ── 月轮 ── */
.moon {
  position: fixed; top: 30px; right: 40px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f5f0d0, #c8b878 50%, #8a7030);
  box-shadow: 0 0 60px rgba(200,180,120,.25), 0 0 120px rgba(200,180,100,.12);
  animation: moonGlow 4s ease-in-out infinite;
  z-index: 0;
}
@keyframes moonGlow {
  0%,100% { box-shadow: 0 0 60px rgba(200,180,120,.25), 0 0 120px rgba(200,180,100,.12); }
  50% { box-shadow: 0 0 80px rgba(200,180,120,.35), 0 0 160px rgba(200,180,100,.18); }
}
.container{max-width:760px;width:100%;position:relative;z-index:1}

/* ── Hero ── */
.hero{text-align:center;margin-bottom:40px;position:relative}
.hero .icon{font-size:64px;margin-bottom:4px;animation:float 3.5s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 0 20px rgba(233,69,96,.4))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero h1{
  font-size:42px;font-weight:900;letter-spacing:6px;margin-bottom:4px;
  background:linear-gradient(135deg,var(--wolf),#d4853b 30%,var(--god) 55%,#c0a060 70%,var(--villager));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero .subtitle{color:var(--text-dim);font-size:14px;letter-spacing:3px;font-weight:300}
.hero .faction-row{display:flex;justify-content:center;gap:20px;margin-top:18px}
.hero .faction-tag{font-size:11px;letter-spacing:2px;padding:5px 16px;border-radius:20px;font-weight:500}
.faction-wolf{background:var(--wolf)15;color:#e07070;border:1px solid var(--wolf)30}
.faction-god{background:var(--god)15;color:#e0c060;border:1px solid var(--god)30}
.faction-villager{background:var(--villager)15;color:#7ab878;border:1px solid var(--villager)30}

/* ── Card ── */
.card{
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  margin-bottom: 20px;
  transition: border-color .3s, box-shadow .3s;
  position: relative;
  overflow: hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.card:hover{border-color:var(--border-glow);box-shadow:0 4px 30px rgba(0,0,0,.3)}
.card-title{
  font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:var(--text);
  letter-spacing: 1px;
}
.card-title .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px var(--accent)66}

.form-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:8px;flex:1;min-width:160px}
.form-group label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
select,input[type=password],input[type=text]{
  background:#0a0a20;border:1px solid var(--border);border-radius:12px;
  padding:11px 16px;color:var(--text);font-size:14px;font-family:inherit;
  outline:none;transition:border-color .25s,box-shadow .25s;
}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,69,96,.1)}
select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,<svg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M1 1L5 5L9 1' stroke='%237a7a9a' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

/* ── 角色网格 ── */
.player-grid{display:grid;grid-template-columns:1fr;gap:10px}
.player-row{
  display:flex;align-items:center;gap:14px;
  background:#0a0a20;border-radius:14px;padding:14px 18px;
  border:1px solid transparent;transition:all .25s;
  position:relative;
}
.player-row:hover{border-color:var(--border);background:#101030;transform:translateX(4px)}
.player-num{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex-shrink:0;
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}
.player-role{
  font-size:13px;font-weight:600;text-align:center;width:80px;flex-shrink:0;
  padding:4px 0;border-radius:6px;
}
.role-wolf{color:var(--wolf);background:var(--wolf)10}
.role-god{color:var(--god);background:var(--god)10}
.role-villager{color:var(--villager);background:var(--villager)10}
.role-hint{flex:1;text-align:right;font-size:11px;color:var(--text-muted);font-style:italic}

/* ── 滑块 ── */
.sliders{display:flex;gap:18px;flex:1;flex-wrap:wrap}
.slider-group{display:flex;align-items:center;gap:10px;flex:1;min-width:140px}
.slider-group .trait-label{font-size:12px;color:var(--text-dim);width:30px;flex-shrink:0;font-weight:600}
.slider-group input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:6px;
  border-radius:4px;background:var(--slider-track);outline:none;cursor:pointer;
}
.slider-group input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:6px;
  background:var(--accent);border:2px solid var(--bg);cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 0 10px rgba(233,69,96,.3);
}
.slider-group input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider-group .val{
  font-size:12px;color:var(--text-dim);width:28px;text-align:right;
  font-family:'SF Mono','Consolas',monospace;font-weight:600;
}

/* ── 按钮 ── */
.btn{display:block;width:100%;padding:18px;font-size:17px;font-weight:700;font-family:inherit;border:none;border-radius:16px;cursor:pointer;transition:all .3s;letter-spacing:2px;position:relative;overflow:hidden}
.btn-primary{
  background:linear-gradient(135deg,var(--wolf),#c0392b 40%,#e94560);
  color:#fff;box-shadow:0 6px 30px rgba(233,69,96,.3);
}
.btn-primary::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.06),transparent);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(233,69,96,.45)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

.preset-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.preset-btn{
  padding:8px 18px;font-size:12px;font-family:inherit;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  color:var(--text-dim);cursor:pointer;transition:all .25s;letter-spacing:.5px;font-weight:600;
}
.preset-btn:hover{border-color:var(--accent);color:var(--text);background:#181838}
.preset-btn.active{background:var(--wolf)20;border-color:var(--wolf);color:#e07070}

.footer-note{text-align:center;color:var(--text-muted);font-size:12px;margin-top:24px;letter-spacing:1px}
.footer-note .sep{color:var(--text-dim);margin:0 8px}

/* ── Toast ── */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--wolf);color:#fff;padding:14px 32px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.toast.error{background:#8b1a1a}

.loading-overlay{position:fixed;inset:0;background:rgba(10,10,20,.9);display:flex;align-items:center;justify-content:center;z-index:9998;opacity:0;pointer-events:none;transition:opacity .3s}
.loading-overlay.show{opacity:1;pointer-events:auto}
.loading-spinner{text-align:center}
.loading-spinner .spinner{width:52px;height:52px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;box-shadow:0 0 20px rgba(233,69,96,.2)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-spinner p{color:var(--text-dim);font-size:14px;letter-spacing:1px}
</style>
</head>
<body>
<div class="moon"></div>
<div class="container">
<div class="hero">
  <div class="icon">🐺</div>
  <h1>月 下 狼 人 杀</h1>
  <p class="subtitle">多智能体协作 · 博弈推理</p>
  <div class="faction-row">
    <span class="faction-tag faction-wolf">🐺 狼人阵营</span>
    <span class="faction-tag faction-god">🔮 神职阵营</span>
    <span class="faction-tag faction-villager">👤 平民阵营</span>
  </div>
</div>

<div class="card">
  <div class="card-title"><span class="dot"></span>LLM 配置</div>
  <div class="form-row">
    <div class="form-group"><label>Provider</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="groq">Groq（免费）</option><option value="gemini">Gemini（免费）</option><option value="ollama">Ollama（本地免费）</option><option value="openai">OpenAI</option><option value="mock">智能 Mock（本地免费）</option></select></div>
    <div class="form-group" style="flex:2"><label>API Key</label><input type="password" id="apikey" value="" placeholder="sk-..." /></div>
  </div>
</div>

<div class="card">
  <div class="card-title"><span class="dot"></span>角色分配 · 7 人局</div>
  <div class="player-grid" id="roleGrid"></div>
</div>

<div class="card">
  <div class="card-title"><span class="dot"></span>AI 人格配置</div>
  <div class="preset-bar">
    <button class="preset-btn active" data-preset="diverse">🎭 多样化</button>
    <button class="preset-btn" data-preset="aggressive">🔥 全员激进</button>
    <button class="preset-btn" data-preset="cautious">🛡️ 全员谨慎</button>
    <button class="preset-btn" data-preset="random">🎲 随机</button>
  </div>
  <div class="player-grid" id="personalityGrid"></div>
</div>

<button class="btn btn-primary" id="btnStart" onclick="startGame()">🌙 开 始 游 戏</button>
<p class="footer-note">
  <span>🐺 2 狼人</span><span class="sep">·</span>
  <span>🔮 1 预言家</span><span class="sep">·</span>
  <span>🧪 1 女巫</span><span class="sep">·</span>
  <span>👤 3 村民</span>
</p>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading"><div class="loading-spinner"><div class="spinner"></div><p>正在创建游戏...</p></div></div>

<script>
var PLAYERS=[
  {num:1,color:"#e94560"},
  {num:2,color:"#f0a500"},
  {num:3,color:"#4ecca3"},
  {num:4,color:"#6c5ce7"},
  {num:5,color:"#e056a0"},
  {num:6,color:"#00b4d8"},
  {num:7,color:"#ff6b6b"}
];
var ROLES=["🐺 狼人","🐺 狼人","🔮 预言家","🧪 女巫","👤 村民","👤 村民","👤 村民"];
var ROLE_CLASS={"🐺 狼人":"role-wolf","🔮 预言家":"role-god","🧪 女巫":"role-god","👤 村民":"role-villager"};
var PRESETS={
diverse:[
  {aggression:.8,talkativeness:.9,caution:.2},{aggression:.3,talkativeness:.4,caution:.9},
  {aggression:.6,talkativeness:.5,caution:.5},{aggression:.9,talkativeness:.7,caution:.1},
  {aggression:.2,talkativeness:.8,caution:.7},{aggression:.5,talkativeness:.3,caution:.6},
  {aggression:.7,talkativeness:.6,caution:.4}
],
aggressive:[
  {aggression:.9,talkativeness:.8,caution:.1},{aggression:.8,talkativeness:.9,caution:.2},
  {aggression:.9,talkativeness:.7,caution:.1},{aggression:.8,talkativeness:.8,caution:.2},
  {aggression:.9,talkativeness:.9,caution:.1},{aggression:.8,talkativeness:.7,caution:.2},
  {aggression:.9,talkativeness:.8,caution:.1}
],
cautious:[
  {aggression:.2,talkativeness:.4,caution:.9},{aggression:.3,talkativeness:.3,caution:.8},
  {aggression:.1,talkativeness:.5,caution:.9},{aggression:.2,talkativeness:.4,caution:.8},
  {aggression:.3,talkativeness:.3,caution:.9},{aggression:.1,talkativeness:.5,caution:.8},
  {aggression:.2,talkativeness:.4,caution:.9}
]};
var currentPreset="diverse";

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function randomPreset(){return Array.from({length:7},function(){return{aggression:Math.round((Math.random()*.8+.1)*10)/10,talkativeness:Math.round((Math.random()*.8+.1)*10)/10,caution:Math.round((Math.random()*.8+.1)*10)/10}})}
function showToast(m,t){var e=document.getElementById("toast");e.textContent=m;e.className="toast "+t+" show";setTimeout(function(){e.className="toast"},2500)}
function loading(s){document.getElementById("loading").className=s?"loading-overlay show":"loading-overlay"}

function renderRoleGrid(){
  var g=document.getElementById("roleGrid");
  var roles=shuffle(ROLES);
  var h="";
  for(var i=0;i<PLAYERS.length;i++){
    var p=PLAYERS[i], r=roles[i], cls=ROLE_CLASS[r]||"";
    h+='<div class="player-row">';
    h+='<div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div>';
    h+='<div class="player-role '+cls+'">'+r+'</div>';
    h+='<div class="role-hint">点击「开始游戏」后随机分配</div>';
    h+='</div>';
  }
  g.innerHTML=h;
}

function renderPersonalityGrid(){
  var g=document.getElementById("personalityGrid");
  var preset=PRESETS[currentPreset]||randomPreset();
  var h="";
  for(var i=0;i<PLAYERS.length;i++){
    var p=PLAYERS[i],t=preset[i];
    h+='<div class="player-row"><div class="player-num" style="background:'+p.color+'22;color:'+p.color+'">'+p.num+'</div><div class="sliders">';
    h+=slider(p.num,"aggression","激进",t.aggression);
    h+=slider(p.num,"talkativeness","话多",t.talkativeness);
    h+=slider(p.num,"caution","谨慎",t.caution);
    h+="</div></div>";
  }
  g.innerHTML=h;
}

function slider(num,trait,label,val){
  return '<div class="slider-group"><span class="trait-label">'+label+'</span><input type="range" min="0" max="1" step="0.1" value="'+val+'" data-player="'+num+'" data-trait="'+trait+'" oninput="updateSlider(this)"><span class="val" id="val-'+num+'-'+trait+'">'+val.toFixed(1)+'</span></div>';
}

function updateSlider(e){
  var p=e.getAttribute("data-player"),t=e.getAttribute("data-trait");
  var s=document.getElementById("val-"+p+"-"+t);
  if(s)s.textContent=parseFloat(e.value).toFixed(1);
}

document.querySelectorAll(".preset-btn").forEach(function(b){
  b.addEventListener("click",function(){
    var n=this.getAttribute("data-preset");
    currentPreset=n;
    document.querySelectorAll(".preset-btn").forEach(function(x){x.classList.remove("active")});
    this.classList.add("active");
    if(n==="random")PRESETS.random=randomPreset();
    renderPersonalityGrid();
  });
});

async function startGame(){
  var provider=document.getElementById("provider").value;
  var apikey=document.getElementById("apikey").value.trim();
  if(provider!=="mock"&&provider!=="ollama"&&!apikey){showToast("请填写 API Key","error");return;}

  var personalities=[];
  document.querySelectorAll("#personalityGrid input[type=range]").forEach(function(e){
    var p=parseInt(e.getAttribute("data-player")),t=e.getAttribute("data-trait");
    if(!personalities[p-1])personalities[p-1]={};
    personalities[p-1][t]=parseFloat(e.value);
  });

  var btn=document.getElementById("btnStart");
  btn.disabled=true;btn.textContent="创建中...";loading(true);

  try{
    var form=new FormData();
    form.append("provider",provider);
    form.append("apikey",apikey||"mock");
    form.append("personalities",JSON.stringify(personalities));
    var r=await fetch("/api/game/create",{method:"POST",body:form});
    var d=await r.json();
    if(d.game_id){
      window.location.href="/game?gid="+d.game_id;
    }else{
      showToast("创建游戏失败","error");
      btn.disabled=false;btn.textContent="🌙 开 始 游 戏";loading(false);
    }
  }catch(e){
    showToast("网络错误: "+e.message,"error");
    btn.disabled=false;btn.textContent="🌙 开 始 游 戏";loading(false);
  }
}

renderRoleGrid();
renderPersonalityGrid();
</script>
</body>
</html>
